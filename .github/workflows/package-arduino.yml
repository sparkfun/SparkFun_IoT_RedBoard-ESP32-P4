name: Package Arduino Patch

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stage under a parent dir so the archive keeps the top-level Arduino/ folder
      - name: Stage Arduino folder
        run: |
          mkdir -p staging
          cp -r Arduino staging/

      # GitHub zips artifacts on download, so this arrives as Arduino_3.3.12_patch.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arduino_3.3.12_patch
          path: staging/
          if-no-files-found: error
